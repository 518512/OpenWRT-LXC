name: OpenWrt x64/arm Matrix 2-Release   
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable SSH debugging'
        required: false
        default: 'false'
  schedule:
    - cron: '0 18 * * 5'  # 每周五 18:00 定时触发

env:
  REPO_URL: https://github.com/openwrt/openwrt
  TZ: Asia/Shanghai
  UPLOAD_RELEASE: true
  PRODUCT_NAME: OpenWRT_Matrix
  PRODUCT_NAME_Bak: OpenWRT_Matrix_Bak

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: openwrt24-x64
            branch: openwrt-24.10
            config: OpenWRT/x86_x64/v23.x64.mini.config
            version: "24.10"
          - name: openwrt24-arm
            branch: openwrt-24.10
            config: OpenWRT/v23.arm64.mini.config
            version: "24.10"
            platform-version: "Arm 24.10"
          - name: openwrt23-x64
            branch: openwrt-23.05
            config: OpenWRT/x86_x64/v23.x64.mini.config
            version: "23.05"
            platform-version: "X64 23.05"
          - name: openwrt23-arm
            branch: openwrt-23.05
            config: OpenWRT/v23.arm64.mini.config
            version: "23.05"
            platform-version: "Arm 23.05"
          - name: openwrt22-x64
            branch: openwrt-22.03
            config: OpenWRT/x86_x64/v23.x64.mini.config
            version: "22.03"
            platform-version: "X64 22.03"
          - name: openwrt22-arm
            branch: openwrt-22.03
            config: OpenWRT/v22.arm64.mini.config
            version: "22.03"
            platform-version: "Arm 22.03"
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup build environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown -R $(whoami):$(whoami) /mnt/workdir
          echo "FILE_DATE2=$(date '+%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 🛠️ 安装依赖包（含 build-essential 和 ccache）
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          echo "deb http://archive.ubuntu.com/ubuntu $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          sudo apt-get clean
          sudo apt-get update -y

          # 确认安装 add-apt-repository 工具
          sudo apt-get install -y software-properties-common

          # 明确添加 universe 组件（有时需要更新 sources.list 后重做）
          sudo add-apt-repository universe || true

          # 再次更新
          sudo apt-get update -y

          # 安装软件包
          sudo apt-get install -y ccache build-essential || \
              (echo "尝试使用apt-get install -y build-essential ccache失败，检查Ubuntu版本和源配置" && exit 1)


      - name: 缓存 ccache 以加速编译 ⚡
        uses: actions/cache@v3
        with:
          path: |
            ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.target.branch }}-${{ matrix.target.name }}-${{ hashFiles('**/OpenWRT/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 💠 克隆源码并保存版本信息
        run: |
          BUILDROOT="/mnt/workdir/${{ matrix.target.name }}"
          TARGET_DIR="$BUILDROOT/openwrt"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "🌀 克隆 OpenWrt 源码（分支 ${{ matrix.target.branch }}）..."
            git clone "$REPO_URL" -b "${{ matrix.target.branch }}" "$TARGET_DIR"
            if [ $? -ne 0 ]; then
              echo "❌ git clone 失败，退出。"
              exit 1
            fi
          else
            echo "✅ 源码已存在，跳过克隆：$TARGET_DIR"
          fi

          mkdir -p "$GITHUB_WORKSPACE/version-info/${{ matrix.target.name }}"

          cd "$TARGET_DIR"
          git show -s --date=short --format="🔖 版本: ${{ matrix.target.name }} / 分支: ${{ matrix.target.branch }}%n👤 Author: %an%n📅 Date: %cd%n🧾 Commit: %s%n🔗 Hash: %H%n" \
            > "$GITHUB_WORKSPACE/version-info/${{ matrix.target.name }}/${{ matrix.target.name }}.version.txt"
        shell: bash

      - name: 更新并安装 feeds（带重试机制） 🔄
        run: |
          BUILDROOT="/mnt/workdir/${{ matrix.target.name }}"
          cd "$BUILDROOT/openwrt"
          retry() {
            local max_attempts=5
            local delay=30
            local attempt=1
            while true; do
              ./scripts/feeds update -a && break
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ feeds update失败，重试 $max_attempts 次后退出"
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "等待 $delay 秒后重试..."
              sleep $delay
            done
          }
          retry
          ./scripts/feeds install -a

      - name: 替换 llvm.download-ci-llvm 仅针对 openwrt24
        if: startsWith(matrix.target.name, 'openwrt24')
        run: |
          cd /mnt/workdir/${{ matrix.target.name }}/openwrt
          grep -rn 'llvm.download-ci-llvm' feeds/packages/lang/rust/ || echo "未找到 llvm.download-ci-llvm"
          sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm="if-unchanged"/g' feeds/packages/lang/rust/Makefile
          grep -rn 'llvm.download-ci-llvm' feeds/packages/lang/rust/ || echo "未找到 llvm.download-ci-llvm"

          
      - name: 检查 llvm.download-ci-llvm 配置
        run: |
          cat /mnt/workdir/${{ matrix.target.name }}/openwrt/feeds/packages/lang/rust/Makefile | grep llvm.download-ci-llvm || echo "未找到 llvm.download-ci-llvm"

      - name: 载入自定义配置和补丁 🧩
        run: |
          BUILDROOT="/mnt/workdir/${{ matrix.target.name }}"
          cp "${{ matrix.target.config }}" "$BUILDROOT/openwrt/.config"
          chmod +x $GITHUB_WORKSPACE/OpenWRT/custom.sh
          cd "$BUILDROOT/openwrt"
          $GITHUB_WORKSPACE/OpenWRT/custom.sh

      - name: 设置 ccache 环境变量 ⚙️
        run: |
          echo "export CCACHE_DIR=\$HOME/.ccache" >> $GITHUB_ENV
          echo "export CC='ccache gcc'" >> $GITHUB_ENV
          echo "export CXX='ccache g++'" >> $GITHUB_ENV

      - name: 下载软件包 📥
        run: |
          BUILDROOT="/mnt/workdir/${{ matrix.target.name }}"
          cd "$BUILDROOT/openwrt"
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Telegram通知 - 开始编译 🚀
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚧 开始构建: ${{ matrix.target.name }}" >/dev/null

      - name: 编译固件 🏗️
        id: compile
        continue-on-error: true
        run: |
          BUILDROOT="/mnt/workdir/${{ matrix.target.name }}"
          cd "$BUILDROOT/openwrt"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Telegram通知 - 编译成功 ✅
        if: steps.compile.outcome == 'success' && steps.compile.outputs.status == 'success'
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=✅ 构建成功: ${{ matrix.target.name }}" >/dev/null

      - name: Telegram通知 - 编译失败 ❌
        if: steps.compile.outcome != 'success' || steps.compile.outputs.status != 'success'
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=❌ 构建失败: ${{ matrix.target.name }}" >/dev/null

      - name: 重命名并复制固件（主Release） 📦
        if: steps.compile.outcome == 'success' && steps.compile.outputs.status == 'success'
        run: |
          cd /mnt/workdir/${{ matrix.target.name }}/openwrt/bin/targets/*/*
          ORIGINAL=$(ls openwrt-*-rootfs.tar.gz | head -n 1)
          NEWNAME="openwrt-${{ matrix.target.version }}-${ORIGINAL#*-}"
          cp "$ORIGINAL" "$NEWNAME"
          echo "FIRMWARE_MAIN=$PWD/$NEWNAME" >> $GITHUB_ENV

      - name: 上传固件至主Release 🚩
        if: steps.compile.outcome == 'success' && steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.PRODUCT_NAME }}
          name: R${{ env.FILE_DATE2 }} for ${{ env.PRODUCT_NAME }}
          body: |
            ✅ OpenWRT 官方精简固件

            自动构建产物。
          files: ${{ env.FIRMWARE_MAIN }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN3 }}

      - name: 重命名并复制固件（备份Release） 🔄
        id: organize
        if: steps.compile.outcome == 'success' && steps.compile.outputs.status == 'success'
        run: |
          mkdir -p $GITHUB_WORKSPACE/renamed
          cd /mnt/workdir/${{ matrix.target.name }}/openwrt/bin/targets/*/*
          ORIGINAL=$(ls openwrt-*-rootfs.tar.gz | head -n 1)
          NEWNAME="openwrt-${{ matrix.target.version }}-${{ env.FILE_DATE2 }}-${ORIGINAL#*${{ matrix.target.version }}-}"
          cp "$ORIGINAL" "$GITHUB_WORKSPACE/renamed/$NEWNAME"
          echo "FIRMWARE_RENAMED=$GITHUB_WORKSPACE/renamed/$NEWNAME" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件至备份Release 🗄️
        if: ${{ env.UPLOAD_RELEASE == 'true' && steps.compile.outcome == 'success' && steps.compile.outputs.status == 'success' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.PRODUCT_NAME_Bak }}
          name: R${{ env.FILE_DATE2 }} for ${{ env.PRODUCT_NAME_Bak }}
          body: |
            🔁 OpenWRT 构建备份（含重命名文件）

          files: ./renamed/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN3 }}

      - name: 上传重命名固件到Artifact 📁
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Renamed-${{ matrix.target.name }}-${{ env.FILE_DATE2 }}
          path: ${{ env.FIRMWARE_RENAMED }}

      - name: 上传版本信息文件到Artifact 📝
        uses: actions/upload-artifact@v4
        with:
          name: VersionInfo-${{ matrix.target.name }}
          path: ${{ github.workspace }}/version-info/${{ matrix.target.name }}/*.version.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 设置Release环境变量 🕒
        run: |
          echo "FILE_DATE3=$(date '+%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 下载版本信息Artifact ⬇️
        uses: actions/download-artifact@v4
        with:
          pattern: VersionInfo-*
          path: ./versions

      - name: 下载重命名固件Artifact ⬇️
        uses: actions/download-artifact@v4
        with:
          pattern: Renamed-*
          path: ./renamed

      - name: 📊 汇总唯一版本信息
        run: |
          mkdir unique
          for file in $(find ./versions -name '*.version.txt'); do
            hash=$(grep '^🔗 Hash:' "$file" | awk '{print $NF}')
            if ! grep -q "$hash" unique/*.version.txt 2>/dev/null; then
              cp "$file" "unique/$(basename $file)"
            fi
          done
          find unique -name "*.version.txt" | sort | xargs cat > version_body.txt
          echo "ALL_VERSION_INFO<<EOF" >> $GITHUB_ENV
          cat version_body.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      - name: 上传备份Release日志 📦
        if: ${{ env.UPLOAD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.PRODUCT_NAME_Bak }}
          name: ${{ env.PRODUCT_NAME_Bak }}
          body: |
            🔁 OpenWRT 构建备份（含重命名文件）

            ${{ env.ALL_VERSION_INFO }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN3 }}

      - name: 上传主Release日志 🚩
        if: ${{ env.UPLOAD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.PRODUCT_NAME }}
          name: R${{ env.FILE_DATE3 }} for ${{ env.PRODUCT_NAME }}
          body: |
            🔁 OpenWRT 构建备份（含重命名文件）

            ${{ env.ALL_VERSION_INFO }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN3 }}

      - name: Telegram通知 - 完成全部版本构建 🎉
        run: |
          text="✔️ OpenWrt x64/arm Matrix 2-Release已成功编译！%0A"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$text" >/dev/null
