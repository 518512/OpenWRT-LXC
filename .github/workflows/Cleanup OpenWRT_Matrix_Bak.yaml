name: Cleanup Old OpenWRT_Matrix_Bak Assets

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "30 2 * * *" # 每天凌晨 2:30 自动执行

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 设置变量
        run: |
          echo "REPO=518512/OpenWRT-LXC" >> $GITHUB_ENV
          echo "TAG_NAME=OpenWRT_Matrix_Bak" >> $GITHUB_ENV
          echo "KEEP=5" >> $GITHUB_ENV
          echo "SEP=|" >> $GITHUB_ENV  # 单字符分隔符，防止 sort 报错

      - name: 安装 GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: 清理老旧产物
        run: |
          echo "=== 步骤 1: 获取 tag $TAG_NAME 的所有 release 产物 ==="
          TMPDIR=$(mktemp -d)
          export TMPDIR
          gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1 || {
            echo "未找到 tag: $TAG_NAME"
            exit 0
          }

          gh release view "$TAG_NAME" --repo "$REPO" --json assets \
            --jq '.assets[] | [.createdAt, .id, .name] | join(env.SEP)' \
            > "$TMPDIR/assets_all.txt"

          total_files=$(wc -l < "$TMPDIR/assets_all.txt" | tr -d ' ')
          echo "总产物数: $total_files"
          if [ "$total_files" -eq 0 ]; then
            echo "没有找到任何产物，退出。"
            exit 0
          fi

          echo "=== 步骤 2: 按 target 分组 ==="
          mkdir -p "$TMPDIR/groups"
          while IFS="$SEP" read -r created id name; do
            target=$(echo "$name" | cut -d'_' -f1)
            echo "$created$SEP$id$SEP$name" >> "$TMPDIR/groups/$target.list"
          done < "$TMPDIR/assets_all.txt"

          echo "分组完成，组数: $(ls "$TMPDIR/groups" | wc -l)"

          echo "=== 步骤 3: 查看每组文件数 ==="
          for f in "$TMPDIR/groups"/*.list; do
            [ -f "$f" ] || continue
            group=$(basename "$f" .list)
            count=$(wc -l < "$f" | tr -d ' ')
            echo "  $group: $count 个文件"
          done

          echo "=== 步骤 4: 同日去重 + 保留最近 $KEEP 个版本 ==="
          summary_file="$TMPDIR/summary.txt"
          printf "" > "$summary_file"

          for f in "$TMPDIR/groups"/*.list; do
            [ -f "$f" ] || continue
            group=$(basename "$f" .list)
            echo "处理组: $group"
            total_group=$(wc -l < "$f" | tr -d ' ')
            echo "  总数: $total_group"

            # 按创建时间倒序
            sort -r -t"$SEP" -k1 "$f" > "$f.sorted"

            # 同日去重（保留当天最新的一个）
            awk -F"$SEP" '
              {
                split($1, dt, "T");
                date = dt[1];
                if (!(date in seen)) {
                  seen[date] = $0;
                }
              }
              END {
                for (d in seen) {
                  print seen[d];
                }
              }
            ' "$f.sorted" | sort -r -t"$SEP" -k1 > "$f.dedup"

            dedup_count=$(wc -l < "$f.dedup" | tr -d ' ')
            echo "  同日去重后: $dedup_count"

            # 保留最近 N 个
            head -n "$KEEP" "$f.dedup" > "$f.keep" || true
            tail -n +"$((KEEP+1))" "$f.dedup" > "$f.delete" || true

            kept=$(wc -l < "$f.keep" 2>/dev/null || echo 0)
            todel=$(wc -l < "$f.delete" 2>/dev/null || echo 0)

            echo "  保留数量: $kept"
            echo "  删除数量: $todel"

            if [ "$todel" -eq 0 ]; then
              echo "  无需删除。"
              printf "Group: %s | total=%s | dedup=%s | keep=%s | delete=%s\n" \
                "$group" "$total_group" "$dedup_count" "$kept" "$todel" >> "$summary_file"
              continue
            fi

            echo "  待删除列表："
            awk -F"$SEP" '{print "    " NR ". " $3 " (created_at: " $1 ")"}' "$f.delete"


            printf "Group: %s | total=%s | dedup=%s | keep=%s | delete=%s\n" \
              "$group" "$total_group" "$dedup_count" "$kept" "$todel" >> "$summary_file"
          done

          echo
          echo "=== 清理汇总 ==="
          cat "$summary_file"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
