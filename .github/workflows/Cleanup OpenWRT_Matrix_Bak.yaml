name: Cleanup OpenWRT_Matrix_Bak Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # 每天 02:30 UTC 自动执行（按需调整）

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      TAG_NAME: OpenWRT_Matrix_Bak
      KEEP: 5
      SEP: "|"   # 单字符分隔，必须是单字符
    steps:
      - name: 安装依赖 gh/jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gh jq
          # 使用 GITHUB_TOKEN 登录 gh（从 secrets 获取）
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 执行清理逻辑（按 target 分组，先同日去重，再保留最近 N 个）
        run: |
          set -euo pipefail
          echo "Repo: $REPO"
          echo "Tag: $TAG_NAME"
          echo "Keep per group: $KEEP"
          echo "SEP: $SEP"

          TMPDIR=$(mktemp -d)
          echo "TMPDIR=$TMPDIR"

          echo "=== 步骤 1: 获取 release assets ==="
          if ! gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "未找到 release for tag: $TAG_NAME，退出。"
            exit 0
          fi

          gh release view "$TAG_NAME" --repo "$REPO" --json assets \
            --jq '.assets[] | [.createdAt, .id, .name] | join(env.SEP)' \
            > "$TMPDIR/assets_all.txt"

          total_files=$(wc -l < "$TMPDIR/assets_all.txt" | tr -d ' ')
          echo "总产物数: $total_files"
          [ "$total_files" -eq 0 ] && { echo "没有产物，退出。"; exit 0; }

          echo
          echo "=== 步骤 2: 按 group 分组（去掉文件名里的第一个 -YYYYMMDDhhmm 时间戳） ==="
          mkdir -p "$TMPDIR/groups"
          while IFS="$SEP" read -r created id name; do
            # 去掉第一个 -12 位时间戳，例如: -202507202208
            group=$(echo "$name" | sed -E 's/-[0-9]{12}//')
            # write as created|id|name (use single-char SEP)
            echo "$created$SEP$id$SEP$name" >> "$TMPDIR/groups/$group.list"
          done < "$TMPDIR/assets_all.txt"

          echo "分组完成，组数: $(ls -1 "$TMPDIR/groups" | wc -l)"
          echo

          echo "=== 步骤 3: 每组统计 ==="
          for f in "$TMPDIR/groups"/*.list; do
            [ -f "$f" ] || continue
            group=$(basename "$f" .list)
            count=$(wc -l < "$f" | tr -d ' ')
            echo "  $group: $count 个文件"
          done
          echo

          echo "=== 步骤 4: 同日去重 + 保留最近 $KEEP 个版本（每组） ==="
          summary="$TMPDIR/summary.txt"
          : > "$summary"

          for f in "$TMPDIR/groups"/*.list; do
            [ -f "$f" ] || continue
            group=$(basename "$f" .list)
            echo "处理组: $group"
            total_group=$(wc -l < "$f" | tr -d ' ')
            echo "  总数: $total_group"

            # 按 createdAt 倒序（ISO8601 lexicographic），新->旧
            sort -r -t"$SEP" -k1 "$f" > "$f.sorted"

            # 同日去重（因为已经倒序，第一次遇到某个 YYYY-MM-DD 就是当天最新）
            awk -F"$SEP" '!seen[substr($1,1,10)]{ seen[substr($1,1,10)]=1; print }' "$f.sorted" > "$f.dedup"

            dedup_count=$(wc -l < "$f.dedup" | tr -d ' ')
            echo "  同日去重后: $dedup_count"

            # 保留最新 KEEP 个，其余删除
            head -n "$KEEP" "$f.dedup" > "$f.keep" || true
            tail -n +"$((KEEP+1))" "$f.dedup" > "$f.delete" || true

            kept=$(wc -l < "$f.keep" 2>/dev/null || echo 0)
            todel=$(wc -l < "$f.delete" 2>/dev/null || echo 0)

            echo "  保留数量: $kept"
            echo "  待删除数量: $todel"

            if [ "$todel" -gt 0 ]; then
              echo "  待删除列表："
              awk -F"$SEP" '{print "    " $3 " (createdAt: " $1 ")"}' "$f.delete"

        
            else
              echo "  无需删除。"
            fi

            printf "Group: %s | total=%s | dedup=%s | keep=%s | delete=%s\n" \
              "$group" "$total_group" "$dedup_count" "$kept" "$todel" >> "$summary"

            echo
          done

          echo "=== 清理汇总 ==="
          cat "$summary"
