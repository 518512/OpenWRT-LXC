name: Cleanup OpenWRT_Matrix_Bak per-matrix (keep N per target)

on:
  schedule:
    - cron: '0 3 * * *'     # 可按需修改为每天凌晨 3 点
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to clean (默认 OpenWRT_Matrix_Bak)'
        required: false
        default: 'OpenWRT_Matrix_Bak'
      keep:
        description: '每个 target 保留最新多少个文件'
        required: false
        default: '5'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      # TOKEN 会从 secrets 中注入（gh api 会自动使用）
    steps:
      - name: 安装依赖 (gh, jq)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq gh

      - name: 清理 release 附件（按 matrix 分组保留最新 N 个）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'OpenWRT_Matrix_Bak' }}
          KEEP: ${{ github.event.inputs.keep || 5 }}
        run: |
          set -euo pipefail
          echo "Repo: $REPO"
          echo "Target release tag: $TAG"
          echo "Per-target keep: $KEEP"

          # 这里的 TOKENS 用来根据文件名识别属于哪个 matrix target
          # 如需按你自己的命名规则修改这列（例如只包含 'x64' / 'arm' / '24' 等片段）
          TOKENS=( "openwrt24-x64" "openwrt24-arm" "openwrt23-x64" "openwrt23-arm" "openwrt22-x64" "openwrt22-arm" )
          echo "使用的分组 token: ${TOKENS[*]}"

          # 获取 release ID
          echo "=== 步骤 1: 获取 Release ==="
          RELEASE_JSON=$(gh api repos/"$REPO"/releases/tags/"$TAG" 2>/dev/null || true)
          if [ -z "$RELEASE_JSON" ]; then
            echo "未找到 tag='$TAG' 对应的 Release，退出。"
            exit 0
          fi
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          echo "Release id: $RELEASE_ID"

          echo
          echo "=== 步骤 2: 拉取所有附件列表 ==="
          ASSETS_JSON=$(gh api repos/"$REPO"/releases/"$RELEASE_ID"/assets 2>/dev/null || echo "[]")
          TOTAL=$(echo "$ASSETS_JSON" | jq 'length')
          echo "资产总数: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "没有附件，结束。"
            exit 0
          fi

          TMPDIR=$(mktemp -d)
          SEP=$'\x1F'   # 安全分隔符（unit separator），避免文件名冲突

          echo
          echo "=== 步骤 3: 按 token 分组资产并写入临时文件 ==="
          echo "$ASSETS_JSON" | jq -c '.[]' | while read -r asset; do
            ID=$(echo "$asset" | jq -r '.id')
            NAME=$(echo "$asset" | jq -r '.name')
            CREATED_AT=$(echo "$asset" | jq -r '.created_at')
            GROUP="__others"
            for t in "${TOKENS[@]}"; do
              if [[ "$NAME" == *"$t"* ]]; then
                GROUP="$t"
                break
              fi
            done
            # 存为 "created_at<SEP>id<SEP>name"
            printf '%s%s%s%s%s\n' "$CREATED_AT" "$SEP" "$ID" "$SEP" "$NAME" >> "$TMPDIR/$GROUP.list"
          done

          echo
          echo "=== 步骤 4: 逐组处理（按时间倒序，保留前 $KEEP 个，删除其余） ==="
          echo

          summary_file="$TMPDIR/summary.txt"
          printf "" > "$summary_file"

          for f in "$TMPDIR"/*.list; do
            [ -f "$f" ] || continue
            group=$(basename "$f" .list)
            echo "处理组: $group"
            total_group=$(wc -l < "$f" | tr -d ' ')
            echo "  该组总数: $total_group"

            # 按 created_at 倒序（新→旧）
            sort -r -t"$SEP" -k1 "$f" > "$f.sorted"

            # 保留和删除列表
            head -n "$KEEP" "$f.sorted" > "$f.keep" || true
            tail -n +"$((KEEP+1))" "$f.sorted" > "$f.delete" || true

            kept=$(wc -l < "$f.keep" 2>/dev/null || echo 0)
            todel=$(wc -l < "$f.delete" 2>/dev/null || echo 0)

            echo "  保留数量: $kept"
            echo "  待删除数量: $todel"

            if [ "$todel" -eq 0 ]; then
              echo "  无需删除，跳过。"
              printf "Group: %s | total=%s | keep=%s | delete=%s\n" "$group" "$total_group" "$kept" "$todel" >> "$summary_file"
              continue
            fi

            echo "  待删除列表："
            awk -F"$SEP" '{print "    " NR ". " $3 " (created_at: " $1 ")"}' "$f.delete"
            echo

            printf "Group: %s | total=%s | keep=%s | delete=%s\n" "$group" "$total_group" "$kept" "$todel" >> "$summary_file"
            echo
          done

          echo
          echo "=== 步骤 5: 最终汇总 ==="
          cat "$summary_file" || true
          echo
          echo "清理完成。"